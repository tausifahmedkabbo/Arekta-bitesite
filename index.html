<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arekta Bitesize - GenZ Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #09090b; 
            --surface-color: rgba(255, 255, 255, 0.03); 
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc; 
            --text-secondary: #94a3b8; 
            --accent-gradient: linear-gradient(135deg, #a855f7, #ec4899);
            --danger-color: #ef4444; 
        }
        body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
        
        /* Glassmorphism Header */
        header { background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 100; }
        
        /* Updated Logo */
        .logo-container { display: flex; align-items: flex-end; font-weight: 800; color: #fff; user-select: none; }
        .logo-a { font-size: 45px; line-height: 38px; margin-right: 2px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text-group { display: flex; flex-direction: column; line-height: 1; }
        .logo-rekta { font-size: 20px; margin-bottom: -2px; letter-spacing: 1px; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; }
        .logo-bitesize { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        
        /* Pill Navigation */
        nav { display: flex; gap: 10px; overflow-x: auto; padding: 15px 20px; border-bottom: 1px solid var(--surface-border); scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; }
        nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; padding: 8px 16px; border-radius: 50px; background: var(--surface-color); border: 1px solid var(--surface-border); transition: all 0.3s ease; }
        nav a:hover, nav a.active { color: #fff; background: var(--accent-gradient); border-color: transparent; }
        
        /* Buttons */
        button { background: var(--surface-color); color: var(--text-primary); border: 1px solid var(--surface-border); padding: 8px 16px; border-radius: 50px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        button:hover { background: rgba(255, 255, 255, 0.1); }
        .primary-btn { background: var(--accent-gradient); color: #fff; border: none; padding: 12px 24px; font-size: 15px; }
        .primary-btn:hover { opacity: 0.9; transform: scale(0.98); }
        .danger-btn { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; font-size: 12px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        #loading { text-align: center; padding: 50px; font-size: 16px; color: var(--text-secondary); font-weight: 600; }
        
        /* App-like News Cards */
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .news-card { background: var(--surface-color); border-radius: 20px; overflow: hidden; border: 1px solid var(--surface-border); display: flex; flex-direction: column; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; backdrop-filter: blur(10px); }
        .news-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(168, 85, 247, 0.15); border-color: rgba(168, 85, 247, 0.3); }
        .news-image { width: 100%; height: 200px; background-color: #1a1a1a; object-fit: cover; }
        .news-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .news-category { font-size: 11px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; display: inline-block; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .news-title { font-size: 18px; font-weight: 800; margin: 0 0 10px 0; line-height: 1.4; color: #fff; }
        .news-text { font-size: 14px; color: var(--text-secondary); margin: 0 0 15px 0; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
        .news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary); padding-top: 15px; border-top: 1px solid var(--surface-border); margin-top: auto; font-weight: 600; }
        
        /* Modern Modal Overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; opacity: 0; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        .modal-content { background: #121214; max-width: 650px; width: 100%; border-radius: 24px; overflow-y: auto; max-height: 85vh; position: relative; border: 1px solid var(--surface-border); display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); transform: translateY(20px); animation: slideUp 0.3s forwards; }
        @keyframes slideUp { to { transform: translateY(0); } }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 24px; cursor: pointer; color: #fff; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); z-index: 10; }
        .close-modal:hover { background: rgba(255,255,255,0.1); }
        .modal-img { width: 100%; height: 320px; object-fit: cover; }
        .modal-body { padding: 30px; }
        .modal-title { font-size: 26px; font-weight: 800; margin: 0 0 15px 0; color: #fff; line-height: 1.3; }
        .modal-text { font-size: 16px; line-height: 1.8; color: var(--text-secondary); white-space: pre-wrap; margin-top: 20px; }
        
        /* Admin Form */
        #admin-panel { display: none; background: var(--surface-color); padding: 30px; border-radius: 24px; border: 1px solid var(--surface-border); backdrop-filter: blur(10px); margin-top: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 14px; background: rgba(0,0,0,0.2); border: 1px solid var(--surface-border); color: #fff; border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 14px; transition: 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #a855f7; background: rgba(168, 85, 247, 0.05); }
        .form-group textarea { height: 120px; resize: vertical; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--surface-border); padding-bottom: 15px; }
        .bilingual-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin: 25px 0; padding: 25px; background: rgba(0,0,0,0.2); border-radius: 16px; border: 1px solid var(--surface-border); }
        .bilingual-fields h3 { margin-top: 0; font-size: 16px; color: #fff; }
        @media (max-width: 768px) { .bilingual-fields { grid-template-columns: 1fr; padding: 15px; } .modal-title { font-size: 22px; } .modal-img { height: 250px; } }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-a">A</div>
            <div class="logo-text-group"><div class="logo-rekta">rekta</div><div class="logo-bitesize">Bitesize</div></div>
        </div>
        <div><button id="lang-toggle">বাংলা</button></div>
    </header>
    
    <nav id="navbar">
        <a href="#" data-en="All" data-bn="সব" class="active">All</a>
        <a href="#" data-en="National" data-bn="দেশ">National</a>
        <a href="#" data-en="International" data-bn="বিদেশ">International</a>
        <a href="#" data-en="Sports" data-bn="খেলা">Sports</a>
        <a href="#" data-en="Entertainment" data-bn="বিনোদন">Entertainment</a>
        <a href="#" data-en="Technology" data-bn="প্রযুক্তি">Technology</a>
        <a href="#" data-en="Opinion" data-bn="মতামত">Opinion</a>
    </nav>

    <div class="container">
        <div id="loading">Syncing Feed...<br><small style="color:var(--danger-color); display:block; margin-top:10px;" id="error-msg"></small></div>
        <div id="news-feed" class="news-grid"></div>
        
        <!-- Modern Modal Box -->
        <div id="news-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="close-modal">&times;</button>
                <img id="modal-img" src="" class="modal-img">
                <div class="modal-body">
                    <div class="news-category" id="modal-cat"></div>
                    <h2 class="modal-title" id="modal-title"></h2>
                    <div class="news-meta" style="border:none; padding:0; margin-bottom:20px; margin-top:10px;" id="modal-meta"></div>
                    <div class="modal-text" id="modal-desc"></div>
                </div>
            </div>
        </div>

        <div id="admin-panel">
            <div class="admin-header"><h2 style="margin:0;">Creator Studio</h2><button onclick="window.location.hash=''" style="background:var(--bg-color)">Close</button></div>
            <form id="post-form">
                <div class="form-group"><label>Category</label><select id="cat" required><option value="National">National</option><option value="International">International</option><option value="Sports">Sports</option><option value="Entertainment">Entertainment</option><option value="Technology">Technology</option><option value="Opinion">Opinion</option></select></div>
                <div class="form-group"><label>Cover Image URL</label><input type="url" id="img-url" placeholder="https://..." required></div>
                <div class="bilingual-fields">
                    <div><h3>English Version</h3><div class="form-group"><label>Headline</label><input type="text" id="title-en" required></div><div class="form-group"><label>Story Content</label><textarea id="desc-en" required></textarea></div></div>
                    <div><h3>Bangla Version</h3><div class="form-group"><label>Headline</label><input type="text" id="title-bn" required></div><div class="form-group"><label>Story Content</label><textarea id="desc-bn" required></textarea></div></div>
                </div>
                <div class="form-group"><label>Source / Credit</label><input type="text" id="source" required></div>
                <button type="submit" class="primary-btn" style="width: 100%; border-radius: 12px;">Drop News Live 🚀</button>
            </form>
            <br><br>
            <h3 style="margin-bottom: 20px;">Manage Feed</h3>
            <div id="admin-news-list"></div>
        </div>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, setDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        const errorMsg = document.getElementById('error-msg'), loading = document.getElementById('loading');
        try {
            const firebaseConfig = { apiKey: "AIzaSyC0LeqT4QrNrx6WHm8eI_KZlAs9dybK3QY", authDomain: "arekta-bitesize.firebaseapp.com", projectId: "arekta-bitesize", storageBucket: "arekta-bitesize.firebasestorage.app", messagingSenderId: "671136231131", appId: "1:671136231131:web:64a45e85eb34165dff26fe" };
            const app = initializeApp(firebaseConfig), db = getFirestore(app);
            let currentLang = 'en', allNewsData = [];
            const langToggleBtn = document.getElementById('lang-toggle'), newsFeed = document.getElementById('news-feed'), adminPanel = document.getElementById('admin-panel'), adminNewsList = document.getElementById('admin-news-list'), postForm = document.getElementById('post-form'), navbar = document.getElementById('navbar'), modal = document.getElementById('news-modal');
            
            document.querySelector('.close-modal').addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (e) => { if(e.target == modal) modal.style.display = 'none'; });
            
            function openModal(id) {
                const news = allNewsData.find(n => n.id === id);
                if(!news) return;
                const title = currentLang === 'en' ? news.title_en : news.title_bn, desc = currentLang === 'en' ? news.desc_en : news.desc_bn;
                const catMap = { "National": "দেশ", "International": "বিদেশ", "Sports": "খেলা", "Entertainment": "বিনোদন", "Technology": "প্রযুক্তি", "Opinion": "মতামত" };
                document.getElementById('modal-img').src = news.img || 'https://via.placeholder.com/800x400';
                document.getElementById('modal-cat').innerText = currentLang === 'en' ? news.category : (catMap[news.category] || news.category);
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-meta').innerHTML = `<span>${new Date(news.timestamp).toLocaleDateString(currentLang === 'en' ? 'en-US' : 'bn-BD', { month: 'short', day: 'numeric', year: 'numeric' })}</span><span>Source: ${news.source}</span>`;
                document.getElementById('modal-desc').innerText = desc;
                modal.style.display = 'flex';
            }

            function checkRoute() {
                if (window.location.hash === '#admin') { adminPanel.style.display = 'block'; newsFeed.style.display = 'none'; loading.style.display = 'none'; } 
                else { adminPanel.style.display = 'none'; newsFeed.style.display = 'grid'; }
            }
            window.addEventListener('hashchange', checkRoute); checkRoute();
            
            langToggleBtn.addEventListener('click', () => { 
                currentLang = currentLang === 'en' ? 'bn' : 'en'; 
                langToggleBtn.innerText = currentLang === 'en' ? 'বাংলা' : 'Eng'; 
                updateNavbarLanguage(); renderNews(); renderAdminList(); 
            });
            
            function updateNavbarLanguage() { navbar.querySelectorAll('a').forEach(link => { link.innerText = link.getAttribute(`data-${currentLang}`); }); }
            
            onSnapshot(collection(db, "news"), (snapshot) => {
                loading.style.display = 'none'; allNewsData = [];
                snapshot.forEach((doc) => { allNewsData.push({ id: doc.id, ...doc.data() }); });
                allNewsData.sort((a, b) => b.timestamp - a.timestamp);
                renderNews(); renderAdminList();
            }, (error) => { loading.style.display = 'block'; errorMsg.innerText = "Error: " + error.message; });
            
            function renderNews() {
                newsFeed.innerHTML = '';
                allNewsData.forEach(news => {
                    if(!news.title_en) return; 
                    const title = currentLang === 'en' ? news.title_en : news.title_bn, desc = currentLang === 'en' ? news.desc_en : news.desc_bn;
                    const catMap = { "National": "দেশ", "International": "বিদেশ", "Sports": "খেলা", "Entertainment": "বিনোদন", "Technology": "প্রযুক্তি", "Opinion": "মতামত" };
                    const card = document.createElement('div'); card.className = 'news-card'; card.setAttribute('data-id', news.id);
                    card.innerHTML = `<img src="${news.img || 'https://via.placeholder.com/800x400'}" class="news-image"><div class="news-content"><div class="news-category">${currentLang === 'en' ? news.category : (catMap[news.category] || news.category)}</div><h3 class="news-title">${title}</h3><p class="news-text">${desc}</p><div class="news-meta"><span>${new Date(news.timestamp).toLocaleDateString(currentLang === 'en' ? 'en-US' : 'bn-BD', { month: 'short', day: 'numeric', year: 'numeric' })}</span><span>${news.source}</span></div></div>`;
                    newsFeed.appendChild(card);
                });
                document.querySelectorAll('.news-card').forEach(el => { el.addEventListener('click', (e) => openModal(el.getAttribute('data-id'))); });
            }
            
            function renderAdminList() {
                adminNewsList.innerHTML = '';
                allNewsData.forEach(news => {
                    if(!news.title_en) return;
                    const div = document.createElement('div'); div.style.cssText = "display:flex; justify-content:space-between; padding:15px; background: rgba(0,0,0,0.2); border-radius:12px; margin-bottom:10px; border:1px solid var(--surface-border); align-items:center;";
                    div.innerHTML = `<span style="font-weight:600; font-size:14px;"><span style="color:var(--accent-color)">[${news.category}]</span> ${currentLang === 'en' ? news.title_en : news.title_bn}</span><button class="danger-btn" data-id="${news.id}">Delete</button>`;
                    adminNewsList.appendChild(div);
                });
                document.querySelectorAll('.danger-btn').forEach(btn => { btn.addEventListener('click', async (e) => { if(confirm("Remove this post?")) await deleteDoc(doc(db, "news", e.target.getAttribute('data-id'))); }); });
            }
            
            postForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = postForm.querySelector('button[type="submit"]'); submitBtn.innerText = "Uploading..."; submitBtn.disabled = true;
                const newsData = { category: document.getElementById('cat').value, img: document.getElementById('img-url').value, title_en: document.getElementById('title-en').value, desc_en: document.getElementById('desc-en').value, title_bn: document.getElementById('title-bn').value, desc_bn: document.getElementById('desc-bn').value, source: document.getElementById('source').value, timestamp: Date.now() };
                try { await setDoc(doc(collection(db, "news")), newsData); postForm.reset(); alert("Live Updated!"); } 
                catch (err) { alert("Error: " + err.message); } finally { submitBtn.innerText = "Drop News Live 🚀"; submitBtn.disabled = false; }
            });
        } catch (e) { errorMsg.innerText = "System Error: " + e.message; }
    </script>
</body>
</html>
